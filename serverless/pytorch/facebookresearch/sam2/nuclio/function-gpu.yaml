metadata:
  name: pth-facebookresearch-sam2-tracker
  namespace: cvat
  annotations:
    name: SAM2 Tracker
    version: 1
    type: tracker
    supported_shape_types: rectangle,polygon,mask
    help_message: Track objects across video frames using SAM2 (Segment Anything Model 2)

spec:
  description: Video object tracking with SAM2
  runtime: 'python:3.10'
  handler: main:handler
  eventTimeout: 60s
  env:
    - name: PYTHONPATH
      value: /opt/nuclio/sam2

  build:
    image: cvat.pth.facebookresearch.sam2.tracker:v4-gpu
    baseImage: ubuntu:22.04

    directives:
      preCopy:
        - kind: ENV
          value: NVIDIA_VISIBLE_DEVICES=all
        - kind: ENV
          value: NVIDIA_DRIVER_CAPABILITIES=compute,utility
        - kind: ENV
          value: DEBIAN_FRONTEND=noninteractive
        - kind: WORKDIR
          value: /opt/nuclio/sam2
        - kind: RUN
          value: apt-get update && apt-get -y install curl git python3 python3-pip python-is-python3 ffmpeg libsm6 libxext6 && rm -rf /var/lib/apt/lists/*
        - kind: RUN
          value: pip3 install torch torchvision torchaudio --no-cache-dir
        - kind: RUN
          value: pip3 install opencv-python-headless numpy pillow huggingface_hub --no-cache-dir
        - kind: RUN
          value: pip3 install git+https://github.com/facebookresearch/sam2.git --no-cache-dir

  triggers:
    myHttpTrigger:
      numWorkers: 1
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 67108864

  readinessTimeoutSeconds: 300

  resources:
    limits:
      nvidia.com/gpu: 1

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
